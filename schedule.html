<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a0b3d">
    <meta name="description" content="PARALLAX '26. Three days of tech, culture and workshops on campus, 20-22 November. Same campus. New angle.">
    <title>Schedule | PARALLAX</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Tektur:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/light.css">
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <header id="site-header"></header>

    <main id="main-content" tabindex="-1">
      <div class="container schedule-page">
        <header class="page-heading">
          <p class="eyebrow">&gt;&gt; PARALLAX / 02</p>
          <h1>Make a day of it<span class="cursor" aria-hidden="true"></span></h1>
          <p class="page-heading__description">A little planning leaves more room for the unplanned.</p>
        </header>

        <div class="schedule-page__tabs" role="tablist" aria-label="Festival days">
          <button type="button" role="tab" id="schedule-tab-1" aria-selected="true" aria-controls="schedule-panel" class="schedule-page__tab" data-day="1">
            <span>[DAY 01]</span>
            <small></small>
          </button>
          <button type="button" role="tab" id="schedule-tab-2" aria-selected="false" aria-controls="schedule-panel" class="schedule-page__tab" data-day="2">
            <span>[DAY 02]</span>
            <small></small>
          </button>
          <button type="button" role="tab" id="schedule-tab-3" aria-selected="false" aria-controls="schedule-panel" class="schedule-page__tab" data-day="3">
            <span>[DAY 03]</span>
            <small></small>
          </button>
        </div>

        <p class="eyebrow schedule-page__timezone">&gt;&gt; All times in IST (UTC+05:30)</p>

        <section id="schedule-panel" role="tabpanel" aria-labelledby="schedule-tab-1">
          <ol class="schedule-page__list" id="schedule-list"></ol>
        </section>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/schedule.js"></script>
  </body>
</html>
